version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # eslint 10 pulls minimatch 10.x via @eslint/config-array, which fails
      # `npm audit` (GHSA-g3hv-75wg-m249). Revisit once it moves to minimatch 11.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
